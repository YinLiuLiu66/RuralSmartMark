[project]
name = "ruralsmartmark"
version = "0.2.0"
description = "智农云链 v2：基于多智能体协同的县域农产品品牌数字化重构系统"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "openai>=1.60.0",
    "pillow>=11.0.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "qrcode[pil]>=8.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "sse-starlette>=2.2.1",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]

[project.scripts]
ruralsmartmark = "ruralsmartmark.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruralsmartmark"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]
