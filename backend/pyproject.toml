[project]
name = "ruralsmartmark"
version = "0.1.0"
description = "RuralSmartMark backend API (FastAPI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "pydantic-settings>=2.7.0",
    "openai>=3.31.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "pyjwt>=2.8",
    "argon2-cffi>=25.1.0",
]

[project.scripts]
ruralsmartmark = "ruralsmartmark.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
# migrations/ 是 alembic 生成物，风格与手写代码不同，不检
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
